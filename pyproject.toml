[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-arbitrage-simulation-ml-platform"
version = "0.1.0"
description = "Service-based crypto arbitrage simulation and ML platform"
requires-python = ">=3.11"
dependencies = ["websockets>=12"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
ml = ["pandas>=2.0,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "matplotlib>=3.8,<4"]
dashboard = ["streamlit>=1.35,<2", "requests>=2.31,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "sqlglot>=25", "pyyaml>=6", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["services", "shared", "tests", "scripts", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# datetime.UTC needs Python 3.11; the local test environment may still be 3.10
ignore = ["UP017", "UP042"]

[tool.ruff.lint.per-file-ignores]
"experiments/run_experiments.py" = ["E501"]  # long report text lines

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
