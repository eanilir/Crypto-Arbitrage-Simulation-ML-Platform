[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-arbitrage-simulation-ml-platform"
version = "0.1.0"
description = "Service-based crypto arbitrage simulation and ML platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["services", "shared", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
